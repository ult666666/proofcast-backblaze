name: Verify local bundle contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify local generation and saved-bundle contracts
        run: python -m pytest
      - name: Compile application source
        run: python -m py_compile app.py proofcast/*.py examples/*.py
      - name: Install eSpeak NG for a real local generation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng
      - name: Generate a real bundle, then sign, log and tamper with copies of it
        env:
          PROOFCAST_OUTPUT_DIR: ${{ runner.temp }}/proofcast-output
        run: |
          python -m proofcast.cli --engine espeak-ng --title "Check before clicking" \
            --script "Verify unexpected requests through a second channel." > "$RUNNER_TEMP/run.json"
          manifest=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["manifest_path"])' "$RUNNER_TEMP/run.json")
          python examples/tamper_demo.py "$manifest"
