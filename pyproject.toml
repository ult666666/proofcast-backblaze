[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "proofcast"
version = "0.1.0"
description = "Local generative-audio accessibility pipeline with Genblaze provenance and Backblaze B2 storage"
requires-python = ">=3.11"
dependencies = [
  "genblaze-core==0.3.4",
  "genblaze-s3==0.3.4",
  "Pillow==13.0.0",
]

[project.scripts]
proofcast = "proofcast.cli:main"

[tool.setuptools.packages.find]
include = ["proofcast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

